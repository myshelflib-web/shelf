// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Align Kotlin stdlib — Cap plugins may pull 1.8.22 while another dep brings
    // kotlin-stdlib-jdk7/jdk8 1.6.21, which duplicate classes folded into newer stdlib.
    configurations.configureEach {
        resolutionStrategy {
            def kv = rootProject.ext.kotlinVersion
            force "org.jetbrains.kotlin:kotlin-stdlib:$kv"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kv"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kv"
            force "org.jetbrains.kotlin:kotlin-stdlib-common:$kv"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
