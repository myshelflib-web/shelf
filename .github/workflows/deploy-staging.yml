name: Deploy staging

# Staging backend/workers (never production). Manual only:
# - Label `deploy-staging` on a PR, or
# - Actions → Deploy staging (workflow_dispatch)
# Production: merge to main (ci.yml / docker-deploy.yml)
# Frontend-only PRs: Vercel Preview only — do not run this

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      backend:
        description: Deploy backend :staging
        type: boolean
        default: true
      processor:
        description: Deploy processor :processor-staging
        type: boolean
        default: true
      ingestion:
        description: Deploy ingestion :ingest-staging
        type: boolean
        default: true

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  PROTECTED_DOCKER_TAGS: main,latest,processor-main,processor-latest,ingest-main,ingest-latest,staging,processor-staging,ingest-staging

jobs:
  gate:
    name: Gate (manual + backend change)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.out.outputs.backend }}
      processing: ${{ steps.out.outputs.processing }}
      ingestion: ${{ steps.out.outputs.ingestion }}
      proceed: ${{ steps.out.outputs.proceed }}
    steps:
      - name: Checkout
        if: github.event_name != 'pull_request' || github.event.label.name == 'deploy-staging'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect changed apps (PR)
        if: github.event_name == 'pull_request' && github.event.label.name == 'deploy-staging'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event.pull_request.base.sha }}
          ref: ${{ github.event.pull_request.head.sha }}
          filters: |
            backend:
              - 'backend/**'
              - '.nvmrc'
            processing:
              - 'processing-service/**'
              - '.nvmrc'
            ingestion:
              - 'ingestion-service/**'
              - '.nvmrc'

      - name: Resolve deploy targets
        id: out
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.label.name }}" != "deploy-staging" ]; then
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "backend=false" >> "$GITHUB_OUTPUT"
              echo "processing=false" >> "$GITHUB_OUTPUT"
              echo "ingestion=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            B="${{ steps.filter.outputs.backend }}"
            P="${{ steps.filter.outputs.processing }}"
            I="${{ steps.filter.outputs.ingestion }}"
            if [ "$B" != "true" ] && [ "$P" != "true" ] && [ "$I" != "true" ]; then
              echo "::error::No backend/processor/ingestion changes. Frontend-only — use Vercel Preview."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "backend=false" >> "$GITHUB_OUTPUT"
              echo "processing=false" >> "$GITHUB_OUTPUT"
              echo "ingestion=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "backend=$B" >> "$GITHUB_OUTPUT"
            echo "processing=$P" >> "$GITHUB_OUTPUT"
            echo "ingestion=$I" >> "$GITHUB_OUTPUT"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${{ inputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "processing=${{ inputs.processor }}" >> "$GITHUB_OUTPUT"
            echo "ingestion=${{ inputs.ingestion }}" >> "$GITHUB_OUTPUT"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  staging-backend:
    name: Staging backend
    needs: gate
    if: needs.gate.outputs.proceed == 'true' && needs.gate.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN"
            exit 1
          fi
      - id: meta
        run: |
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.DOCKERHUB_USERNAME }}/shelf" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENSURE_MODE: ensure
        run: |
          chmod +x scripts/ensure-private-dockerhub-repos.sh
          ./scripts/ensure-private-dockerhub-repos.sh shelf
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:staging
            ${{ steps.meta.outputs.image }}:staging-${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=backend-staging
          cache-to: type=gha,mode=max,scope=backend-staging
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENSURE_MODE: verify
        run: ./scripts/ensure-private-dockerhub-repos.sh shelf
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MAX_DOCKER_TAGS: "20"
          PROTECTED_DOCKER_TAGS: ${{ env.PROTECTED_DOCKER_TAGS }}
        run: |
          chmod +x scripts/prune-dockerhub-tags.sh
          ./scripts/prune-dockerhub-tags.sh shelf
      - env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND_STAGING }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::No RENDER_DEPLOY_HOOK_BACKEND_STAGING — image pushed only"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" >/dev/null
          echo "Triggered staging backend (isolated DB + S3)"

  staging-processor:
    name: Staging processor
    needs: gate
    if: needs.gate.outputs.proceed == 'true' && needs.gate.outputs.processing == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN"
            exit 1
          fi
      - id: meta
        run: |
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.DOCKERHUB_USERNAME }}/shelf" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENSURE_MODE: ensure
        run: |
          chmod +x scripts/ensure-private-dockerhub-repos.sh
          ./scripts/ensure-private-dockerhub-repos.sh shelf
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./processing-service
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:processor-staging
            ${{ steps.meta.outputs.image }}:processor-staging-${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=processing-staging
          cache-to: type=gha,mode=max,scope=processing-staging
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENSURE_MODE: verify
        run: ./scripts/ensure-private-dockerhub-repos.sh shelf
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MAX_DOCKER_TAGS: "20"
          PROTECTED_DOCKER_TAGS: ${{ env.PROTECTED_DOCKER_TAGS }}
        run: |
          chmod +x scripts/prune-dockerhub-tags.sh
          ./scripts/prune-dockerhub-tags.sh shelf
      - env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PROCESSOR_STAGING }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::No RENDER_DEPLOY_HOOK_PROCESSOR_STAGING — image pushed only"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" >/dev/null
          echo "Triggered staging processor"

  staging-ingestion:
    name: Staging ingestion
    needs: gate
    if: needs.gate.outputs.proceed == 'true' && needs.gate.outputs.ingestion == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN"
            exit 1
          fi
      - id: meta
        run: |
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.DOCKERHUB_USERNAME }}/shelf" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENSURE_MODE: ensure
        run: |
          chmod +x scripts/ensure-private-dockerhub-repos.sh
          ./scripts/ensure-private-dockerhub-repos.sh shelf
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./ingestion-service
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:ingest-staging
            ${{ steps.meta.outputs.image }}:ingest-staging-${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=ingestion-staging
          cache-to: type=gha,mode=max,scope=ingestion-staging
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENSURE_MODE: verify
        run: ./scripts/ensure-private-dockerhub-repos.sh shelf
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MAX_DOCKER_TAGS: "20"
          PROTECTED_DOCKER_TAGS: ${{ env.PROTECTED_DOCKER_TAGS }}
        run: |
          chmod +x scripts/prune-dockerhub-tags.sh
          ./scripts/prune-dockerhub-tags.sh shelf
      - env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_INGESTION_STAGING }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::No RENDER_DEPLOY_HOOK_INGESTION_STAGING — image pushed only"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" >/dev/null
          echo "Triggered staging ingestion"

  cleanup-label:
    name: Remove deploy-staging label
    needs: [gate, staging-backend, staging-processor, staging-ingestion]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.label.name == 'deploy-staging' &&
      needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'deploy-staging',
              });
              console.log('Removed deploy-staging label (re-add to deploy again)');
            } catch (e) {
              console.log('Label cleanup skipped:', e.message);
            }

  comment-preview-url:
    name: Comment preview URL on PR
    needs: [gate, staging-backend, staging-processor, staging-ingestion]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.gate.outputs.proceed == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      deployments: read
    steps:
      - name: Resolve preview URL and comment
        uses: actions/github-script@v7
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          STAGING_FRONTEND_ALIAS: ${{ vars.STAGING_FRONTEND_ALIAS }}
        with:
          script: |
            const marker = '### Staging deploy ready';
            const branch = context.payload.pull_request.head.ref;
            const sha = context.payload.pull_request.head.sha;
            const stagingApi = (process.env.STAGING_API_URL || '').replace(/\/$/, '');
            const alias = (process.env.STAGING_FRONTEND_ALIAS || '').replace(/^https?:\/\//, '').replace(/\/$/, '');

            let previewUrl = '';

            // 1) Vercel API — latest READY deployment for this branch
            if (process.env.VERCEL_TOKEN && process.env.VERCEL_PROJECT_ID) {
              try {
                const qs = new URLSearchParams({
                  projectId: process.env.VERCEL_PROJECT_ID,
                  limit: '20',
                  'meta-githubCommitRef': branch,
                });
                if (process.env.VERCEL_ORG_ID) {
                  qs.set('teamId', process.env.VERCEL_ORG_ID);
                }
                const res = await fetch(`https://api.vercel.com/v6/deployments?${qs}`, {
                  headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
                });
                if (res.ok) {
                  const data = await res.json();
                  const deps = data.deployments || [];
                  const match =
                    deps.find((d) => d.meta?.githubCommitSha === sha && d.readyState === 'READY') ||
                    deps.find((d) => d.readyState === 'READY') ||
                    deps[0];
                  if (match?.url) {
                    previewUrl = match.url.startsWith('http') ? match.url : `https://${match.url}`;
                  }
                } else {
                  console.log('Vercel API status', res.status, await res.text());
                }
              } catch (e) {
                console.log('Vercel lookup failed:', e.message);
              }
            }

            // 2) GitHub deployment statuses (Vercel app)
            if (!previewUrl) {
              try {
                const { data: deployments } = await github.rest.repos.listDeployments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: sha,
                  per_page: 10,
                });
                for (const d of deployments) {
                  const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    deployment_id: d.id,
                    per_page: 5,
                  });
                  const ok = statuses.find((s) => s.environment_url || s.target_url);
                  if (ok) {
                    previewUrl = ok.environment_url || ok.target_url;
                    break;
                  }
                }
              } catch (e) {
                console.log('GitHub deployments lookup failed:', e.message);
              }
            }

            // 3) Optional stable staging FE alias
            if (!previewUrl && alias) {
              previewUrl = `https://${alias}`;
            }

            const lines = [
              marker,
              '',
              'Shared **staging API** was updated from this PR (isolated DB + R2).',
              '',
            ];
            if (stagingApi) {
              lines.push(`- **Staging API:** ${stagingApi}`);
            }
            if (previewUrl) {
              lines.push(`- **Frontend preview:** ${previewUrl}`);
            } else {
              lines.push(
                '- **Frontend preview:** check the Vercel bot comment on this PR (Preview deployment).',
                '',
                '_Tip: set repo secrets `VERCEL_TOKEN` + `VERCEL_PROJECT_ID` (and `VERCEL_ORG_ID` if needed) to auto-print the URL here._'
              );
            }
            lines.push(
              '',
              'Production was **not** changed. Re-add label `deploy-staging` to deploy again.'
            );
            const body = lines.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            if (previewUrl) {
              core.notice(`Preview URL: ${previewUrl}`);
            }
