name: Deploy staging

# Manual shared-staging update (never production).
# Trigger: add label `deploy-staging` on a PR that changes backend/workers,
# or Actions → Deploy staging (workflow_dispatch) on a branch.
# Frontend-only PRs: use Vercel Preview only — do not run this workflow.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      backend:
        description: Deploy backend :staging
        type: boolean
        default: true
      processor:
        description: Deploy processor :processor-staging
        type: boolean
        default: true
      ingestion:
        description: Deploy ingestion :ingest-staging
        type: boolean
        default: true

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  PROTECTED_DOCKER_TAGS: main,latest,processor-main,processor-latest,ingest-main,ingest-latest,staging,processor-staging,ingest-staging

jobs:
  gate:
    name: Gate (backend change + manual)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.out.outputs.backend }}
      processing: ${{ steps.out.outputs.processing }}
      ingestion: ${{ steps.out.outputs.ingestion }}
      proceed: ${{ steps.out.outputs.proceed }}
    steps:
      - name: Checkout
        if: github.event_name != 'pull_request' || github.event.label.name == 'deploy-staging'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect changed apps (PR)
        if: github.event_name == 'pull_request' && github.event.label.name == 'deploy-staging'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event.pull_request.base.sha }}
          ref: ${{ github.event.pull_request.head.sha }}
          filters: |
            backend:
              - 'backend/**'
              - '.nvmrc'
            processing:
              - 'processing-service/**'
              - '.nvmrc'
            ingestion:
              - 'ingestion-service/**'
              - '.nvmrc'

      - name: Resolve deploy targets
        id: out
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.label.name }}" != "deploy-staging" ]; then
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "backend=false" >> "$GITHUB_OUTPUT"
              echo "processing=false" >> "$GITHUB_OUTPUT"
              echo "ingestion=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            B="${{ steps.filter.outputs.backend }}"
            P="${{ steps.filter.outputs.processing }}"
            I="${{ steps.filter.outputs.ingestion }}"
            if [ "$B" != "true" ] && [ "$P" != "true" ] && [ "$I" != "true" ]; then
              echo "::error::No backend/processor/ingestion changes on this PR. Frontend-only — use Vercel Preview; do not deploy staging."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "backend=false" >> "$GITHUB_OUTPUT"
              echo "processing=false" >> "$GITHUB_OUTPUT"
              echo "ingestion=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "backend=$B" >> "$GITHUB_OUTPUT"
            echo "processing=$P" >> "$GITHUB_OUTPUT"
            echo "ingestion=$I" >> "$GITHUB_OUTPUT"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${{ inputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "processing=${{ inputs.processor }}" >> "$GITHUB_OUTPUT"
            echo "ingestion=${{ inputs.ingestion }}" >> "$GITHUB_OUTPUT"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  staging-backend:
    name: Staging backend
    needs: gate
    if: needs.gate.outputs.proceed == 'true' && needs.gate.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN"
            exit 1
          fi
      - id: meta
        run: |
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.DOCKERHUB_USERNAME }}/shelf" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENSURE_MODE: ensure
        run: |
          chmod +x scripts/ensure-private-dockerhub-repos.sh
          ./scripts/ensure-private-dockerhub-repos.sh shelf
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:staging
            ${{ steps.meta.outputs.image }}:staging-${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=backend-staging
          cache-to: type=gha,mode=max,scope=backend-staging
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENSURE_MODE: verify
        run: ./scripts/ensure-private-dockerhub-repos.sh shelf
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MAX_DOCKER_TAGS: "20"
          PROTECTED_DOCKER_TAGS: ${{ env.PROTECTED_DOCKER_TAGS }}
        run: |
          chmod +x scripts/prune-dockerhub-tags.sh
          ./scripts/prune-dockerhub-tags.sh shelf
      - env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND_STAGING }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::No RENDER_DEPLOY_HOOK_BACKEND_STAGING — image pushed, Render not triggered"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" >/dev/null
          echo "Triggered staging backend"

  staging-processor:
    name: Staging processor
    needs: gate
    if: needs.gate.outputs.proceed == 'true' && needs.gate.outputs.processing == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN"
            exit 1
          fi
      - id: meta
        run: |
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.DOCKERHUB_USERNAME }}/shelf" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENSURE_MODE: ensure
        run: |
          chmod +x scripts/ensure-private-dockerhub-repos.sh
          ./scripts/ensure-private-dockerhub-repos.sh shelf
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./processing-service
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:processor-staging
            ${{ steps.meta.outputs.image }}:processor-staging-${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=processing-staging
          cache-to: type=gha,mode=max,scope=processing-staging
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENSURE_MODE: verify
        run: ./scripts/ensure-private-dockerhub-repos.sh shelf
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MAX_DOCKER_TAGS: "20"
          PROTECTED_DOCKER_TAGS: ${{ env.PROTECTED_DOCKER_TAGS }}
        run: |
          chmod +x scripts/prune-dockerhub-tags.sh
          ./scripts/prune-dockerhub-tags.sh shelf
      - env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PROCESSOR_STAGING }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::No RENDER_DEPLOY_HOOK_PROCESSOR_STAGING — image pushed, Render not triggered"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" >/dev/null
          echo "Triggered staging processor"

  staging-ingestion:
    name: Staging ingestion
    needs: gate
    if: needs.gate.outputs.proceed == 'true' && needs.gate.outputs.ingestion == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN"
            exit 1
          fi
      - id: meta
        run: |
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.DOCKERHUB_USERNAME }}/shelf" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENSURE_MODE: ensure
        run: |
          chmod +x scripts/ensure-private-dockerhub-repos.sh
          ./scripts/ensure-private-dockerhub-repos.sh shelf
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./ingestion-service
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:ingest-staging
            ${{ steps.meta.outputs.image }}:ingest-staging-${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=ingestion-staging
          cache-to: type=gha,mode=max,scope=ingestion-staging
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENSURE_MODE: verify
        run: ./scripts/ensure-private-dockerhub-repos.sh shelf
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MAX_DOCKER_TAGS: "20"
          PROTECTED_DOCKER_TAGS: ${{ env.PROTECTED_DOCKER_TAGS }}
        run: |
          chmod +x scripts/prune-dockerhub-tags.sh
          ./scripts/prune-dockerhub-tags.sh shelf
      - env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_INGESTION_STAGING }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::No RENDER_DEPLOY_HOOK_INGESTION_STAGING — image pushed, Render not triggered"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" >/dev/null
          echo "Triggered staging ingestion"

  cleanup-label:
    name: Remove deploy-staging label
    needs: [gate, staging-backend, staging-processor, staging-ingestion]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.label.name == 'deploy-staging' &&
      needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'deploy-staging',
              });
              console.log('Removed deploy-staging label (re-add to deploy again)');
            } catch (e) {
              console.log('Label cleanup skipped:', e.message);
            }
