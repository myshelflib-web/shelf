name: Docker deploy

# Called from ci.yml after checks pass on push to main only.
# Writes production tags + prod Render hooks. Never staging.

on:
  workflow_call:
    inputs:
      backend:
        type: boolean
        required: true
      processing:
        type: boolean
        required: true
      ingestion:
        type: boolean
        required: true

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  PROTECTED_DOCKER_TAGS: main,latest,processor-main,processor-latest,ingest-main,ingest-latest,staging,processor-staging,ingest-staging

jobs:
  docker-backend:
    name: Production backend
    if: inputs.backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Require Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secrets"
            exit 1
          fi
      - id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.DOCKERHUB_USERNAME }}/shelf" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENSURE_MODE: ensure
        run: |
          chmod +x scripts/ensure-private-dockerhub-repos.sh
          ./scripts/ensure-private-dockerhub-repos.sh shelf
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:main
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENSURE_MODE: verify
        run: ./scripts/ensure-private-dockerhub-repos.sh shelf
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MAX_DOCKER_TAGS: "20"
          PROTECTED_DOCKER_TAGS: ${{ env.PROTECTED_DOCKER_TAGS }}
        run: |
          chmod +x scripts/prune-dockerhub-tags.sh
          ./scripts/prune-dockerhub-tags.sh shelf
      - env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          if [ -z "$HOOK" ]; then echo "Skip production backend (no hook)"; exit 0; fi
          curl -fsS -X POST "$HOOK" >/dev/null
          echo "Triggered production backend"
      - run: |
          echo "### Production backend" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.meta.outputs.image }}:main\`" >> "$GITHUB_STEP_SUMMARY"

  docker-processor:
    name: Production processor
    if: inputs.processing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Require Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secrets"
            exit 1
          fi
      - id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.DOCKERHUB_USERNAME }}/shelf" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENSURE_MODE: ensure
        run: |
          chmod +x scripts/ensure-private-dockerhub-repos.sh
          ./scripts/ensure-private-dockerhub-repos.sh shelf
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./processing-service
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:processor-main
            ${{ steps.meta.outputs.image }}:processor-latest
            ${{ steps.meta.outputs.image }}:processor-${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=processing-service
          cache-to: type=gha,mode=max,scope=processing-service
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENSURE_MODE: verify
        run: ./scripts/ensure-private-dockerhub-repos.sh shelf
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MAX_DOCKER_TAGS: "20"
          PROTECTED_DOCKER_TAGS: ${{ env.PROTECTED_DOCKER_TAGS }}
        run: |
          chmod +x scripts/prune-dockerhub-tags.sh
          ./scripts/prune-dockerhub-tags.sh shelf
      - env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PROCESSOR }}
        run: |
          if [ -z "$HOOK" ]; then echo "Skip production processor (no hook)"; exit 0; fi
          curl -fsS -X POST "$HOOK" >/dev/null
          echo "Triggered production processor"
      - run: |
          echo "### Production processor" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.meta.outputs.image }}:processor-main\`" >> "$GITHUB_STEP_SUMMARY"

  docker-ingestion:
    name: Production ingestion
    if: inputs.ingestion
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Require Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secrets"
            exit 1
          fi
      - id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.DOCKERHUB_USERNAME }}/shelf" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENSURE_MODE: ensure
        run: |
          chmod +x scripts/ensure-private-dockerhub-repos.sh
          ./scripts/ensure-private-dockerhub-repos.sh shelf
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./ingestion-service
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:ingest-main
            ${{ steps.meta.outputs.image }}:ingest-latest
            ${{ steps.meta.outputs.image }}:ingest-${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=ingestion-service
          cache-to: type=gha,mode=max,scope=ingestion-service
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENSURE_MODE: verify
        run: ./scripts/ensure-private-dockerhub-repos.sh shelf
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MAX_DOCKER_TAGS: "20"
          PROTECTED_DOCKER_TAGS: ${{ env.PROTECTED_DOCKER_TAGS }}
        run: |
          chmod +x scripts/prune-dockerhub-tags.sh
          ./scripts/prune-dockerhub-tags.sh shelf
      - env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_INGESTION }}
        run: |
          if [ -z "$HOOK" ]; then echo "Skip production ingestion (no hook)"; exit 0; fi
          curl -fsS -X POST "$HOOK" >/dev/null
          echo "Triggered production ingestion"
      - run: |
          echo "### Production ingestion" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.meta.outputs.image }}:ingest-main\`" >> "$GITHUB_STEP_SUMMARY"
