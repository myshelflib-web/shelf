name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Don't cancel image publishes on main — a follow-up push was aborting docker build.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      processing: ${{ steps.filter.outputs.processing }}
      ingestion: ${{ steps.filter.outputs.ingestion }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Filter paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: json
          # Apps are independent. Editing this workflow or docs must not
          # rebuild/redeploy unchanged apps.
          filters: |
            backend:
              - 'backend/**'
              - '.nvmrc'
            processing:
              - 'processing-service/**'
              - '.nvmrc'
            ingestion:
              - 'ingestion-service/**'
              - '.nvmrc'
            frontend:
              - 'frontend/**'
              - '.nvmrc'

      - name: Summary
        env:
          BACKEND: ${{ steps.filter.outputs.backend }}
          PROCESSING: ${{ steps.filter.outputs.processing }}
          INGESTION: ${{ steps.filter.outputs.ingestion }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
        run: |
          {
            echo "### Changed apps"
            echo ""
            echo "| App | Changed |"
            echo "|-----|---------|"
            echo "| Backend | $BACKEND |"
            echo "| Processing service | $PROCESSING |"
            echo "| Ingestion service | $INGESTION |"
            echo "| Frontend | $FRONTEND |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "backend=$BACKEND processing=$PROCESSING ingestion=$INGESTION frontend=$FRONTEND"

  ci-backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Lint
        run: npm run lint --prefix backend
      - name: Typecheck
        run: npm run typecheck --prefix backend
      - name: Test
        run: npm run test --prefix backend
      - name: Build
        working-directory: backend
        run: npm run build

  ci-processing:
    name: Processing service
    needs: changes
    if: needs.changes.outputs.processing == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: processing-service/package-lock.json
      - name: Install
        working-directory: processing-service
        run: npm ci
      - name: Lint
        run: npm run lint --prefix processing-service
      - name: Typecheck
        run: npm run typecheck --prefix processing-service
      - name: Test
        run: npm run test --prefix processing-service
      - name: Build
        working-directory: processing-service
        run: npm run build

  ci-ingestion:
    name: Ingestion service
    needs: changes
    if: needs.changes.outputs.ingestion == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: ingestion-service/package-lock.json
      - name: Install
        working-directory: ingestion-service
        run: npm ci
      - name: Lint
        run: npm run lint --prefix ingestion-service
      - name: Typecheck
        run: npm run typecheck --prefix ingestion-service
      - name: Test
        run: npm run test --prefix ingestion-service
      - name: Build
        working-directory: ingestion-service
        run: npm run build

  ci-frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        run: npm run lint --prefix frontend
      - name: Typecheck
        run: npm run typecheck --prefix frontend
      - name: Test
        run: npm run test --prefix frontend
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL != '' && vars.NEXT_PUBLIC_API_URL || 'https://api.example.com' }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID != '' && vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || 'ci-placeholder' }}
        run: npm run build

  docker-backend:
    name: Deploy backend (Render)
    needs: [changes, ci-backend]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Require Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secrets"
            exit 1
          fi
      - name: Set image tags
        id: meta
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          echo "sha=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.DOCKERHUB_USERNAME }}/shelf" >> "$GITHUB_OUTPUT"
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Ensure Docker Hub repos are PRIVATE
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENSURE_MODE: ensure
        run: |
          chmod +x scripts/ensure-private-dockerhub-repos.sh
          ./scripts/ensure-private-dockerhub-repos.sh shelf
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build & push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:main
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Verify images remain PRIVATE
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENSURE_MODE: verify
        run: ./scripts/ensure-private-dockerhub-repos.sh shelf
      - name: Prune old tags (keep max 10)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MAX_DOCKER_TAGS: "10"
          PROTECTED_DOCKER_TAGS: "main,latest,processor-main,processor-latest,ingest-main,ingest-latest"
        run: |
          chmod +x scripts/prune-dockerhub-tags.sh
          ./scripts/prune-dockerhub-tags.sh shelf
      - name: Trigger Render redeploy
        env:
          RENDER_DEPLOY_HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_BACKEND" ]; then
            echo "Skip backend (no deploy hook secret)"
            exit 0
          fi
          echo "Triggering backend..."
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_BACKEND" >/dev/null
          echo "Triggered backend"
      - name: Summary
        run: |
          {
            echo "### Backend image pushed"
            echo ""
            echo "\`${{ steps.meta.outputs.image }}:main\` → Render hook"
          } >> "$GITHUB_STEP_SUMMARY"

  docker-processor:
    name: Deploy processor (Render)
    needs: [changes, ci-processing]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.changes.outputs.processing == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Require Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secrets"
            exit 1
          fi
      - name: Set image tags
        id: meta
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          echo "sha=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.DOCKERHUB_USERNAME }}/shelf" >> "$GITHUB_OUTPUT"
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Ensure Docker Hub repos are PRIVATE
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENSURE_MODE: ensure
        run: |
          chmod +x scripts/ensure-private-dockerhub-repos.sh
          ./scripts/ensure-private-dockerhub-repos.sh shelf
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build & push processing service
        uses: docker/build-push-action@v7
        with:
          context: ./processing-service
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:processor-main
            ${{ steps.meta.outputs.image }}:processor-latest
            ${{ steps.meta.outputs.image }}:processor-${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=processing-service
          cache-to: type=gha,mode=max,scope=processing-service
      - name: Verify images remain PRIVATE
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENSURE_MODE: verify
        run: ./scripts/ensure-private-dockerhub-repos.sh shelf
      - name: Prune old tags (keep max 10)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MAX_DOCKER_TAGS: "10"
          PROTECTED_DOCKER_TAGS: "main,latest,processor-main,processor-latest,ingest-main,ingest-latest"
        run: |
          chmod +x scripts/prune-dockerhub-tags.sh
          ./scripts/prune-dockerhub-tags.sh shelf
      - name: Trigger Render redeploy
        env:
          RENDER_DEPLOY_HOOK_PROCESSOR: ${{ secrets.RENDER_DEPLOY_HOOK_PROCESSOR }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_PROCESSOR" ]; then
            echo "Skip processor (no deploy hook secret)"
            exit 0
          fi
          echo "Triggering processor..."
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_PROCESSOR" >/dev/null
          echo "Triggered processor"
      - name: Summary
        run: |
          {
            echo "### Processor image pushed"
            echo ""
            echo "\`${{ steps.meta.outputs.image }}:processor-main\` → Render hook"
          } >> "$GITHUB_STEP_SUMMARY"

  docker-ingestion:
    name: Deploy ingestion (Render)
    needs: [changes, ci-ingestion]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.changes.outputs.ingestion == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Require Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secrets"
            exit 1
          fi
      - name: Set image tags
        id: meta
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          echo "sha=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.DOCKERHUB_USERNAME }}/shelf" >> "$GITHUB_OUTPUT"
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Ensure Docker Hub repos are PRIVATE
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENSURE_MODE: ensure
        run: |
          chmod +x scripts/ensure-private-dockerhub-repos.sh
          ./scripts/ensure-private-dockerhub-repos.sh shelf
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build & push ingestion service
        uses: docker/build-push-action@v7
        with:
          context: ./ingestion-service
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:ingest-main
            ${{ steps.meta.outputs.image }}:ingest-latest
            ${{ steps.meta.outputs.image }}:ingest-${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=ingestion-service
          cache-to: type=gha,mode=max,scope=ingestion-service
      - name: Verify images remain PRIVATE
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENSURE_MODE: verify
        run: ./scripts/ensure-private-dockerhub-repos.sh shelf
      - name: Prune old tags (keep max 10)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MAX_DOCKER_TAGS: "10"
          PROTECTED_DOCKER_TAGS: "main,latest,processor-main,processor-latest,ingest-main,ingest-latest"
        run: |
          chmod +x scripts/prune-dockerhub-tags.sh
          ./scripts/prune-dockerhub-tags.sh shelf
      - name: Trigger Render redeploy
        env:
          RENDER_DEPLOY_HOOK_INGESTION: ${{ secrets.RENDER_DEPLOY_HOOK_INGESTION }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_INGESTION" ]; then
            echo "Skip ingestion (no deploy hook secret)"
            exit 0
          fi
          echo "Triggering ingestion..."
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_INGESTION" >/dev/null
          echo "Triggered ingestion"
      - name: Summary
        run: |
          {
            echo "### Ingestion image pushed"
            echo ""
            echo "\`${{ steps.meta.outputs.image }}:ingest-main\` → Render hook"
          } >> "$GITHUB_STEP_SUMMARY"
