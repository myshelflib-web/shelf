name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Don't cancel image publishes on main — a follow-up push was aborting docker build.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      processing: ${{ steps.filter.outputs.processing }}
      ingestion: ${{ steps.filter.outputs.ingestion }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Filter paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: json
          # Apps are independent. Editing this workflow or docs must not
          # rebuild/redeploy unchanged apps.
          filters: |
            backend:
              - 'backend/**'
              - '.nvmrc'
            processing:
              - 'processing-service/**'
              - '.nvmrc'
            ingestion:
              - 'ingestion-service/**'
              - '.nvmrc'
            frontend:
              - 'frontend/**'
              - '.nvmrc'

      - name: Summary
        env:
          BACKEND: ${{ steps.filter.outputs.backend }}
          PROCESSING: ${{ steps.filter.outputs.processing }}
          INGESTION: ${{ steps.filter.outputs.ingestion }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
        run: |
          {
            echo "### Changed apps"
            echo ""
            echo "| App | Changed |"
            echo "|-----|---------|"
            echo "| Backend | $BACKEND |"
            echo "| Processing service | $PROCESSING |"
            echo "| Ingestion service | $INGESTION |"
            echo "| Frontend | $FRONTEND |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "backend=$BACKEND processing=$PROCESSING ingestion=$INGESTION frontend=$FRONTEND"

  ci-backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Lint
        run: npm run lint --prefix backend
      - name: Typecheck
        run: npm run typecheck --prefix backend
      - name: Test
        run: npm run test --prefix backend
      - name: Copyright compliance audit
        run: npm run preloaded:copyright-audit --prefix backend
      - name: Build
        working-directory: backend
        run: npm run build

  ci-processing:
    name: Processing service
    needs: changes
    if: needs.changes.outputs.processing == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: processing-service/package-lock.json
      - name: Install
        working-directory: processing-service
        run: npm ci
      - name: Lint
        run: npm run lint --prefix processing-service
      - name: Typecheck
        run: npm run typecheck --prefix processing-service
      - name: Test
        run: npm run test --prefix processing-service
      - name: Build
        working-directory: processing-service
        run: npm run build

  ci-ingestion:
    name: Ingestion service
    needs: changes
    if: needs.changes.outputs.ingestion == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: ingestion-service/package-lock.json
      - name: Install
        working-directory: ingestion-service
        run: npm ci
      - name: Lint
        run: npm run lint --prefix ingestion-service
      - name: Typecheck
        run: npm run typecheck --prefix ingestion-service
      - name: Test
        run: npm run test --prefix ingestion-service
      - name: Build
        working-directory: ingestion-service
        run: npm run build

  ci-frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        run: npm run lint --prefix frontend
      - name: Typecheck
        run: npm run typecheck --prefix frontend
      - name: Test
        run: npm run test --prefix frontend
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL != '' && vars.NEXT_PUBLIC_API_URL || 'https://api.example.com' }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID != '' && vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || 'ci-placeholder' }}
        run: npm run build

  docker-deploy:
    name: Docker + Render (production)
    needs: [changes, ci-backend, ci-processing, ci-ingestion]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      (
        (needs.changes.outputs.backend == 'true' && needs.ci-backend.result == 'success') ||
        (needs.changes.outputs.processing == 'true' && needs.ci-processing.result == 'success') ||
        (needs.changes.outputs.ingestion == 'true' && needs.ci-ingestion.result == 'success')
      )
    uses: ./.github/workflows/docker-deploy.yml
    secrets: inherit
    with:
      backend: ${{ needs.changes.outputs.backend == 'true' && needs.ci-backend.result == 'success' }}
      processing: ${{ needs.changes.outputs.processing == 'true' && needs.ci-processing.result == 'success' }}
      ingestion: ${{ needs.changes.outputs.ingestion == 'true' && needs.ci-ingestion.result == 'success' }}

  staging-manual-hint:
    name: Staging deploy (manual — add label)
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      (
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.processing == 'true' ||
        needs.changes.outputs.ingestion == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Instruct manual staging deploy
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '### Manual staging deploy',
              '',
              'This PR changes **backend / processor / ingestion**.',
              'Staging uses a **separate Neon DB** and **separate R2 bucket** (see `docs/STAGING.md`).',
              '',
              '**To update staging images:** add the label `deploy-staging`.',
              '',
              '- Rebuilds `:staging*` tags and triggers staging Render hooks only.',
              '- Production DB, bucket, and `:main` images are **not** touched.',
              '- Frontend-only PRs: use Vercel Preview only.',
              '',
              'Re-add the label after it is removed to deploy again.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '### Manual staging deploy';
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
            core.notice('Add label deploy-staging to update shared staging (isolated DB + S3).');
      - name: Check summary
        run: |
          {
            echo "### Staging is manual on this PR"
            echo ""
            echo "Add the GitHub label \`deploy-staging\` to push staging Docker tags and redeploy shared staging."
            echo "Frontend preview: use the Vercel Preview deployment on this PR."
          } >> "$GITHUB_STEP_SUMMARY"
