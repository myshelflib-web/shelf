services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: upsc
      POSTGRES_PASSWORD: upsc_secret
      POSTGRES_DB: upsc_learning
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    volumes:
      - ./docker/minio-cors.json:/cors.json:ro
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/upsc-docs --ignore-existing;
      mc cors set local/upsc-docs /cors.json || true;
      mc anonymous set download local/upsc-docs;
      exit 0;
      "

  # Vector DB for Study AI retrieval (local Qdrant)
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # OpenAI-compatible LLM + embeddings for local Study AI (optional — pull models once, see README)
  ollama:
    image: ollama/ollama:latest
    container_name: shelf-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ai

  # Local Grafana stack (Loki + Prometheus + Tempo + Grafana UI). OTLP HTTP on :4318.
  # Start: docker compose --profile observability up -d
  # Then set OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 in backend/.env and processing-service/.env
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3001:3000"
      - "4317:4317"
      - "4318:4318"
    profiles:
      - observability

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
  ollama_data:
